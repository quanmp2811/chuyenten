<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Hiển thị giao diện localhost</title>
  <style>
    :root {
      color-scheme: dark;
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
      background: #0b1020;
      color: #e8ecf5;
    }

    * {
      box-sizing: border-box;
    }

    body {
      min-width: 320px;
      min-height: 100vh;
      margin: 0;
      display: flex;
      flex-direction: column;
    }

    header {
      padding: 20px 24px;
      border-bottom: 1px solid #252d40;
      background: #11182a;
    }

    h1 {
      margin: 0 0 6px;
      font-size: 20px;
    }

    .subtitle,
    .hint {
      color: #a7b0c3;
      font-size: 13px;
    }

    form {
      display: flex;
      gap: 10px;
      margin-top: 16px;
    }

    input {
      flex: 1;
      min-width: 0;
      padding: 11px 13px;
      border: 1px solid #35415a;
      border-radius: 8px;
      outline: none;
      background: #0b1020;
      color: inherit;
      font: inherit;
    }

    input:focus {
      border-color: #7c9cff;
      box-shadow: 0 0 0 3px #7c9cff24;
    }

    button {
      padding: 0 18px;
      border: 0;
      border-radius: 8px;
      background: #7896ff;
      color: #0b1020;
      font: inherit;
      font-weight: 650;
      cursor: pointer;
    }

    button:hover {
      background: #91a8ff;
    }

    .hint {
      margin: 10px 0 0;
    }

    #status {
      min-height: 20px;
      padding: 8px 24px;
      color: #ffc98b;
      font-size: 13px;
    }

    main {
      flex: 1;
      min-height: 300px;
      padding: 0 16px 16px;
    }

    iframe {
      display: block;
      width: 100%;
      height: 100%;
      min-height: 300px;
      border: 1px solid #252d40;
      border-radius: 10px;
      background: #fff;
    }

    @media (max-width: 560px) {
      header {
        padding: 18px 16px;
      }

      form {
        flex-direction: column;
      }

      button {
        min-height: 42px;
      }

      main {
        padding: 0 10px 10px;
      }
    }
  </style>
</head>
<body>
  <header>
    <h1>Hiển thị giao diện localhost</h1>
    <div class="subtitle">Nhập địa chỉ ứng dụng đang chạy trên máy của bạn.</div>
    <form id="url-form">
      <input
        id="url-input"
        type="text"
        inputmode="url"
        autocomplete="url"
        spellcheck="false"
        aria-label="Địa chỉ localhost"
        value="http://localhost:3000"
        required
      >
      <button type="submit">Mở giao diện</button>
    </form>
    <p class="hint">Ví dụ: http://localhost:3000 hoặc http://127.0.0.1:8080</p>
  </header>
  <div id="status" role="status" aria-live="polite"></div>
  <main>
    <iframe id="preview" title="Giao diện ứng dụng localhost"></iframe>
  </main>

  <script>
    const form = document.querySelector("#url-form");
    const input = document.querySelector("#url-input");
    const preview = document.querySelector("#preview");
    const status = document.querySelector("#status");
    const loopbackHosts = new Set(["localhost", "127.0.0.1", "[::1]", "::1"]);

    form.addEventListener("submit", (event) => {
      event.preventDefault();
      const value = input.value.trim();

      try {
        const url = new URL(value.includes("://") ? value : `http://${value}`);
        if (!["http:", "https:"].includes(url.protocol)) {
          throw new Error("Chỉ hỗ trợ địa chỉ HTTP hoặc HTTPS.");
        }
        if (!loopbackHosts.has(url.hostname.toLowerCase())) {
          throw new Error("Địa chỉ phải trỏ đến localhost (localhost, 127.0.0.1 hoặc ::1).");
        }

        input.value = url.href;
        status.textContent = `Đang tải ${url.href}`;
        preview.src = url.href;
      } catch (error) {
        status.textContent = error instanceof TypeError
          ? "Địa chỉ không hợp lệ. Hãy nhập URL như http://localhost:3000."
          : error.message;
      }
    });

    preview.addEventListener("load", () => {
      if (preview.src && preview.src !== "about:blank") {
        status.textContent = "";
      }
    });

    form.requestSubmit();
  </script>
</body>
</html>
