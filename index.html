<!doctype html>
<html lang="vi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Giao diện ứng dụng</title>
  <style>
    :root {
      color-scheme: dark;
      font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
      background: #0b1020;
      color: #e8ecf5;
    }

    body {
      margin: 0;
      background: #0b1020;
    }

    iframe {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      display: block;
      border: 0;
      background: #fff;
    }

    iframe[hidden] {
      display: none;
    }

    #empty {
      display: grid;
      min-height: 100vh;
      place-items: center;
      padding: 16px;
      color: #a7b0c3;
      text-align: center;
    }
  </style>
</head>
<body>
  <iframe id="preview" title="Giao diện ứng dụng" hidden></iframe>
  <div id="empty">Đang kết nối…</div>

  <script type="module">
    import { firebaseConfig, FIREBASE_SDK } from "./firebase-config.js?v=2";

    const preview = document.querySelector("#preview");
    const empty = document.querySelector("#empty");

    try {
      const { initializeApp } = await import(`${FIREBASE_SDK}/firebase-app.js`);
      const { getDatabase, ref, onValue } = await import(`${FIREBASE_SDK}/firebase-database.js`);

      const db = getDatabase(initializeApp(firebaseConfig));

      // Theo dõi tên miền đang được chia sẻ, cập nhật ngay khi trang nhập thay đổi
      onValue(ref(db, "current"), (snapshot) => {
        const url = snapshot.val()?.url;
        if (url) {
          if (preview.src !== url) preview.src = url;
          preview.hidden = false;
          empty.hidden = true;
        } else {
          preview.removeAttribute("src");
          preview.hidden = true;
          empty.hidden = false;
          empty.textContent = "Hiện chưa có trang nào được chia sẻ.";
        }
      }, () => {
        empty.textContent = "Không đọc được dữ liệu. Kiểm tra lại cấu hình Firebase.";
      });
    } catch {
      empty.textContent = "Không kết nối được Firebase. Kiểm tra file firebase-config.js.";
    }
  </script>
</body>
</html>
